- name: Deploy new app version
  hosts: raspberries
  gather_facts: false
  vars:
    valid_old_pids: []
  tasks:
    - name: Get old apps pid
      block:
        - name: Read old pid
          ansible.builtin.command: "cat {{item}}.pid"
          loop: "{{ entrypoints }}"
          loop_control:
            label: "{{ item }}"
          register: old_pids_cmd_outs
          args:
            chdir: "{{ active_release_link }}"
          failed_when: false

        # Append when pid correct
        - name: Append valid old PIDs
          ansible.builtin.set_fact:
            valid_old_pids: "{{ valid_old_pids + [item.stdout] }}"
          loop: "{{ old_pids_cmd_outs.results }}"
          when:
            - item.rc == 0
            - (item.stdout | regex_search('^[0-9]+$')) == item.stdout

    - name: Gen release path
      ansible.builtin.include_tasks: tasks/gen_release_path.yml

    - name: Make shadow copy
      ansible.builtin.command:
        cmd: "cp -L -r {{active_release_link}} {{release_path}}"

    - name: Fetch latest state from git main
      ansible.builtin.command:
        cmd: git pull
      args:
        chdir: "{{release_path}}"

    - name: Render application config
      ansible.builtin.template:
        src: "{{playbook_dir}}/../templates/config.toml.j2"
        dest: "{{ release_path }}/config.toml"
        mode: "0644"

    - name: UV sync
      ansible.builtin.command: "~/.local/bin/uv --directory {{release_path}} sync"

    - name: Run new app instance
      ansible.builtin.include_tasks: tasks/run_app.yml

    - name: Stop old instances
      ansible.builtin.shell:
        cmd: "kill {{item}}"
      loop: "{{ valid_old_pids }}"
      args:
        executable: /bin/bash
      failed_when: false