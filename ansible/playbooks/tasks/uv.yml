- name: Check uv
  ansible.builtin.stat:
    path: ~/.local/bin/uv
  register: uv_binary

- name: Download UV packet manager
  ansible.builtin.get_url:
    url: "https://astral.sh/uv/{{uv_version}}/install.sh"
    dest: /tmp/uv_install.sh
    mode: '0775'
  when: not uv_binary.stat.exists

- name: Install UV packet manager
  ansible.builtin.command: /tmp/uv_install.sh
  when: not uv_binary.stat.exists

- name: Remove temp files
  ansible.builtin.file:
    state: absent
    path: /tmp/uv_install.sh
  when: not uv_binary.stat.exists