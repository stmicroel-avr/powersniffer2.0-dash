- name: Create root directory
  become: true
  ansible.builtin.file:
    path: "{{app_root}}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Create release directory
  ansible.builtin.file:
    path: "{{releases_dir}}"
    state: directory

- name: Create logs directory
  ansible.builtin.file:
    path: "{{logs_dir}}"
    state: directory