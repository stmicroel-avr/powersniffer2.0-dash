- name: Download mongodb
  ansible.builtin.get_url:
    url: "{{mongodb_deb_link}}"
    dest: /tmp/mongodb.deb
    checksum: "sha256:9768bec133794a2b5095d7ce82764ca0419cd4d8460b7dc3fd6fcfb3ae66318a"

- name: Install .deb package
  become: true
  ansible.builtin.apt:
    deb: /tmp/mongodb.deb

- name: Create MongoDB service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/mongod.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=MongoDB Database Server
      After=network.target

      [Service]
      User=mongodb
      Group=mongodb
      ExecStart=/usr/bin/mongod --config /etc/mongod.conf
      Restart=on-failure
      LimitNOFILE=64000

      [Install]
      WantedBy=multi-user.target

- name: Enable MongoDB service and start
  become: true
  ansible.builtin.systemd_service:
    name: mongod
    daemon_reload: true
    enabled: true
    state: started

- name: Wait for MongoDB to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 27017
    timeout: 60

- name: Install PyMongo
  become: true
  ansible.builtin.apt:
    name: python3-pymongo
    state: present

- name: Create MongoDB superuser
  become: true
  community.mongodb.mongodb_user:
    login_host: "127.0.0.1"
    database: admin
    name: admin
    password: "{{ mongodb_admin_password }}"
    roles:
      - role: root
        db: admin
    state: present
    update_password: always
    create_for_localhost_exception: /var/lib/mongodb/.ansible-admin-created
  no_log: true

- name: Create MongoDB application user
  community.mongodb.mongodb_user:
    login_host: "127.0.0.1"
    login_database: admin
    login_user: admin
    login_password: "{{ mongodb_admin_password }}"
    auth_mechanism: SCRAM-SHA-256
    database: "{{ mongodb_app_dbname }}"
    name: "{{ mongodb_app_user }}"
    password: "{{ mongodb_app_password }}"
    roles:
      - role: readWrite
        db: "{{ mongodb_app_dbname }}"
    state: present
    update_password: on_create
  no_log: true