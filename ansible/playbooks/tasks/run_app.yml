- name: Create current release link
  ansible.builtin.file:
    src: "{{release_path}}"
    dest: "{{active_release_link}}"
    state: link

- name: Start new app instance
  ansible.builtin.shell: |
    nohup "$HOME/.local/bin/uv" run {{item}} > {{item}}.log 2>&1 &
    echo $! > {{item}}.pid
  loop: "{{ entrypoints }}"
  args:
    chdir: "{{ active_release_link }}"
    executable: /bin/bash
