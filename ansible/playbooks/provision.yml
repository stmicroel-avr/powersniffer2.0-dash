- name: Build env
  hosts: raspberries
  tasks:
   - name: Print message
     ansible.builtin.debug:
       msg: Logged in

   - name: UV
     ansible.builtin.include_tasks: tasks/uv.yml

   - name: Create app root directories
     ansible.builtin.file:
       path: "{{item}}"
       state: directory
     loop: "{{ directories }}"

   - name: Make init release
     ansible.builtin.include_tasks: tasks/init_release.yml