<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerSniffer Dashboard</title>
  <!-- Styles -->
  <link rel="stylesheet" href="./assets/bootstrap.min.css">
  <link rel="stylesheet" href="./assets/app.css">
  <!-- JS -->
  <script src="./assets/dashboard.js"></script>
  <script src="./assets/app.simulation.js"></script>
  <script src="./assets/echarts.min.js"></script>
</head>

<body class="bg-body-tertiary">
  <header class="bg-body border-bottom">
    <div class="container-xxl py-3">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <h1 class="h4 mb-0">PowerSniffer Dashboard</h1>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <label for="device" class="small text-body-secondary">
            Device under test
          </label>

          <div class="d-flex gap-2">
            <select id="device" name="device" class="form-select form-select-sm">
              <option value="unknown">unknown</option>
            </select>

            <button
              type="button"
              id="add-device"
              class="btn btn-sm btn-outline-secondary"
              aria-label="Add device"
              title="Add device"
            >
              +
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-xxl py-4">
    <!-- Latest measurements -->
    <div class="row g-3 mb-4">
      <!-- Load -->
      <section class="col-12 col-md-8" aria-labelledby="load-heading">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-transparent d-flex align-items-center justify-content-between">
            <h2 id="load-heading" class="h6 mb-0">Load</h2>

            <p id="load-status" class="badge text-bg-secondary fw-normal mb-0">
              Disconnected
            </p>
          </div>

          <div class="card-body">
            <dl class="row g-0 mb-0">
              <div class="col-6 border-end pe-3">
                <dt class="small text-body-secondary fw-normal mb-2">
                  Voltage
                </dt>
                <dd class="fs-2 mb-0">
                  <output id="load-voltage">0.00</output>
                  <span class="fs-6 text-body-secondary">V</span>
                </dd>
              </div>

              <div class="col-6 ps-3">
                <dt class="small text-body-secondary fw-normal mb-2">
                  Current
                </dt>
                <dd class="fs-2 mb-0">
                  <output id="load-current">0.00</output>
                  <span class="fs-6 text-body-secondary">A</span>
                </dd>
              </div>
            </dl>
          </div>

          <section class="card-footer bg-transparent" aria-labelledby="session-heading">
            <div class="d-flex flex-wrap align-items-baseline gap-3 small">
              <h3 id="session-heading" class="small fw-semibold mb-0">
                Session
              </h3>

              <dl class="d-flex flex-wrap gap-3 mb-0">
                <div class="d-flex gap-1">
                  <dt class="text-body-secondary fw-normal">Started:</dt>
                  <dd id="session-start" class="mb-0">—</dd>
                </div>

                <div class="d-flex gap-1">
                  <dt class="text-body-secondary fw-normal">Ended:</dt>
                  <dd id="session-end" class="mb-0">—</dd>
                </div>

                <div class="d-flex gap-1">
                  <dt class="text-body-secondary fw-normal">Duration:</dt>
                  <dd id="session-duration" class="mb-0">—</dd>
                </div>

                <div class="d-flex gap-1">
                  <dt class="text-body-secondary fw-normal">Measurements:</dt>
                  <dd id="session-count" class="mb-0">0</dd>
                </div>
              </dl>
            </div>
          </section>
        </div>
      </section>

      <!-- Measurement device -->
      <section class="col-12 col-md-4" aria-labelledby="instrument-heading">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-body-tertiary">
            <h2 id="instrument-heading" class="h6 mb-0">
              Measurement device
            </h2>
          </div>

          <div class="card-body">
            <dl class="mb-0">
              <dt class="small text-body-secondary fw-normal mb-2">
                Battery voltage
              </dt>
              <dd class="fs-2 mb-0">
                <output id="battery-voltage">—</output>
                <span class="fs-6 text-body-secondary">V</span>
              </dd>
            </dl>
          </div>
        </div>
      </section>
    </div>

    <div class="row g-3 align-items-start">
      <!-- Charts and history -->
      <section class="col-12 col-lg-9" aria-labelledby="history-heading">
        <div class="card shadow-sm">
          <div class="card-header bg-transparent p-3">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
              <h2 id="history-heading" class="h6 mb-0">
                Measurement history
              </h2>

              <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="btn-group btn-group-sm" role="group" aria-label="Time range">
                  <button
                    type="button"
                    class="btn btn-outline-secondary active"
                    data-minutes="15"
                  >
                    15 min
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-minutes="60"
                  >
                    1 h
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-minutes="360"
                  >
                    6 h
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-minutes="1440"
                  >
                    24 h
                  </button>
                </div>

                <div class="form-check form-switch mb-0">
                  <input
                    type="checkbox"
                    id="live"
                    class="form-check-input"
                    role="switch"
                    checked
                  >
                  <label for="live" class="form-check-label small">
                    Live updates
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Custom date range -->
          <div class="p-3 border-bottom">
            <form id="range-form" class="row g-2 align-items-end">
              <div class="col-12 col-sm">
                <label for="range-from" class="form-label small">From</label>
                <input
                  type="datetime-local"
                  id="range-from"
                  name="from"
                  class="form-control form-control-sm"
                  required
                >
              </div>

              <div class="col-12 col-sm">
                <label for="range-to" class="form-label small">To</label>
                <input
                  type="datetime-local"
                  id="range-to"
                  name="to"
                  class="form-control form-control-sm"
                  required
                >
              </div>

              <div class="col-auto">
                <button type="submit" class="btn btn-sm btn-primary">
                  Apply
                </button>
              </div>
            </form>
          </div>

          <!-- Load charts -->
          <section class="p-3" aria-labelledby="load-charts-heading">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
              <div>
                <h3 id="load-charts-heading" class="h6 mb-1">Load</h3>
                <span id="selected-range" class="small text-body-secondary">—</span>
              </div>

              <div class="d-flex align-items-center gap-2">
                <label for="export-type" class="visually-hidden">
                  Measurements
                </label>

                <select
                  id="export-type"
                  name="type"
                  class="form-select form-select-sm w-auto"
                >
                  <option value="current">Current</option>
                  <option value="voltage">Voltage</option>
                  <option value="both" selected>Both</option>
                </select>

                <button
                  type="button"
                  id="export"
                  class="btn btn-sm btn-outline-secondary text-nowrap"
                >
                  Export CSV
                </button>
              </div>
            </div>

            <figure class="mb-4">
              <figcaption class="small text-primary mb-2">
                Load voltage · V
              </figcaption>
              <div id="load-voltage-chart"></div>
            </figure>

            <figure class="mb-0">
              <figcaption class="small text-warning-emphasis mb-2">
                Load current · A
              </figcaption>
              <div id="load-current-chart"></div>
            </figure>
          </section>

          <!-- Battery chart -->
          <section class="p-3 border-top" aria-labelledby="battery-chart-heading">
            <h3 id="battery-chart-heading" class="h6 mb-3">
              Measurement device
            </h3>

            <figure class="mb-0">
              <figcaption class="small text-success mb-2">
                Battery voltage · V
              </figcaption>
              <div id="battery-voltage-chart"></div>
            </figure>
          </section>

          <div class="card-footer bg-transparent d-flex justify-content-end p-3">
            <button
              type="button"
              id="reset-zoom"
              class="btn btn-sm btn-outline-secondary"
            >
              Reset zoom
            </button>
          </div>
        </div>
      </section>

      <!-- Incoming measurements -->
      <aside class="col-12 col-lg-3" aria-labelledby="incoming-heading">
        <div class="card shadow-sm">
          <div class="card-header bg-transparent p-3">
            <h2 id="incoming-heading" class="h6 mb-0">
              Incoming data
            </h2>
          </div>

          <div class="px-3 py-2 border-bottom">
            <p class="small text-body-secondary mb-0">Newest first</p>
          </div>

          <ol
            id="incoming-data"
            class="list-group list-group-flush list-unstyled mb-0"
            aria-label="Recent measurements"
          ></ol>
        </div>
      </aside>
    </div>
  </main>

  <!-- Add device dialog -->
  <dialog
    id="device-dialog"
    class="border rounded-3 bg-body text-body p-0 shadow"
    aria-labelledby="device-dialog-heading"
  >
    <div class="p-3 border-bottom">
      <h2 id="device-dialog-heading" class="h5 mb-0">Add device</h2>
    </div>

    <form id="device-form">
      <div class="p-3">
        <label for="device-name" class="form-label">Device name</label>
        <input
          type="text"
          id="device-name"
          name="name"
          class="form-control"
          maxlength="60"
          placeholder="e.g. Desk lamp"
          required
        >
      </div>

      <div class="p-3 border-top d-flex justify-content-end gap-2">
        <button
          type="button"
          id="cancel-device"
          class="btn btn-outline-secondary"
        >
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          Add device
        </button>
      </div>
    </form>
  </dialog>
</body>
</html>
