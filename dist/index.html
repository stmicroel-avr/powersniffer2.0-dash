<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerSniffer Dashboard</title>
</head>
<body>
  <header>
    <h1>PowerSniffer Dashboard</h1>

    <label for="device">Device under test</label>
    <select id="device" name="device">
      <option value="unknown">unknown</option>
    </select>
    <button type="button" id="add-device" aria-label="Add device">+</button>
  </header>

  <main>
    <section aria-labelledby="load-heading">
      <h2 id="load-heading">Load</h2>

      <p id="load-status">Disconnected</p>

      <dl>
        <dt>Voltage</dt>
        <dd><output id="load-voltage">0.00</output> V</dd>

        <dt>Current</dt>
        <dd><output id="load-current">0.00</output> A</dd>
      </dl>

      <section aria-labelledby="session-heading">
        <h3 id="session-heading">Session</h3>

        <dl>
          <dt>Started</dt>
          <dd id="session-start">—</dd>

          <dt>Ended</dt>
          <dd id="session-end">—</dd>

          <dt>Duration</dt>
          <dd id="session-duration">—</dd>

          <dt>Measurements</dt>
          <dd id="session-count">0</dd>
        </dl>
      </section>
    </section>

    <section aria-labelledby="instrument-heading">
      <h2 id="instrument-heading">Measurement device</h2>

      <dl>
        <dt>Battery voltage</dt>
        <dd><output id="battery-voltage">—</output> V</dd>
      </dl>
    </section>

    <section aria-labelledby="history-heading">
      <h2 id="history-heading">Measurement history</h2>

      <div role="group" aria-label="Time range">
        <button type="button" data-minutes="15">15 min</button>
        <button type="button" data-minutes="60">1 h</button>
        <button type="button" data-minutes="360">6 h</button>
        <button type="button" data-minutes="1440">24 h</button>
      </div>

      <form id="range-form">
        <label for="range-from">From</label>
        <input type="datetime-local" id="range-from" name="from" required>

        <label for="range-to">To</label>
        <input type="datetime-local" id="range-to" name="to" required>

        <button type="submit">Apply</button>
      </form>

      <label>
        <input type="checkbox" id="live" checked>
        Live updates
      </label>

      <button type="button" id="reset-zoom">Reset zoom</button>

      <section aria-labelledby="load-charts-heading">
        <h3 id="load-charts-heading">Load</h3>

        <div>
          <span id="selected-range">—</span>

          <label for="export-type">Measurements</label>
          <select id="export-type" name="type">
            <option value="current">Current</option>
            <option value="voltage">Voltage</option>
            <option value="both" selected>Both</option>
          </select>

          <button type="button" id="export">Export CSV</button>
        </div>

        <figure>
          <figcaption>Load voltage · V</figcaption>
          <div id="load-voltage-chart"></div>
        </figure>

        <figure>
          <figcaption>Load current · A</figcaption>
          <div id="load-current-chart"></div>
        </figure>
      </section>

      <section aria-labelledby="battery-chart-heading">
        <h3 id="battery-chart-heading">Measurement device</h3>

        <figure>
          <figcaption>Battery voltage · V</figcaption>
          <div id="battery-voltage-chart"></div>
        </figure>
      </section>
    </section>

    <aside aria-labelledby="incoming-heading">
      <h2 id="incoming-heading">Incoming data</h2>
      <p>Newest first</p>

      <ol id="incoming-data" aria-label="Recent measurements"></ol>
    </aside>
  </main>

  <dialog id="device-dialog" aria-labelledby="device-dialog-heading">
    <h2 id="device-dialog-heading">Add device</h2>

    <form id="device-form">
      <label for="device-name">Device name</label>
      <input
        type="text"
        id="device-name"
        name="name"
        maxlength="60"
        placeholder="e.g. Desk lamp"
        required
      >

      <button type="button" id="cancel-device">Cancel</button>
      <button type="submit">Add device</button>
    </form>
  </dialog>
</body>
</html>
